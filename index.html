<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WavVisualizer</title>
  </head>
  <body>
    <div id="app">
      <canvas id="viz"></canvas>
      <canvas id="viz-gl" class="hidden"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-inner">
          <h1>WavVisualizer</h1>
          <p>A Windows Media Player&ndash;style visualizer for whatever's playing on your system.</p>
          <button id="share-btn" type="button">Share Audio</button>
          <p class="hint">
            Works best in Chrome/Edge. When prompted, share a tab, window, or
            screen and make sure <strong>&ldquo;Share audio&rdquo;</strong> is checked.
          </p>

          <div class="divider"><span>or</span></div>

          <form id="soundcloud-form" class="soundcloud-form">
            <input
              id="soundcloud-url"
              type="url"
              inputmode="url"
              placeholder="Paste a SoundCloud track link&hellip;"
              aria-label="SoundCloud track URL"
              required
            />
            <button id="soundcloud-play-btn" type="submit">Play</button>
          </form>
        </div>
      </div>

      <div id="toast" class="toast hidden"></div>

      <div id="now-playing" class="now-playing hidden">
        <div class="now-playing-main">
          <img id="now-playing-art" class="now-playing-art" alt="" />
          <div class="now-playing-info">
            <span id="now-playing-title" class="now-playing-title">&mdash;</span>
            <span class="now-playing-source">SoundCloud</span>
          </div>
          <button id="now-playing-toggle" class="hud-btn" type="button" aria-label="Play/Pause">&#9208;</button>
        </div>
        <div class="now-playing-controls">
          <button id="queue-prev-btn" class="hud-btn hud-btn-sm" type="button" aria-label="Previous track">&#9664;</button>
          <span id="queue-counter" class="queue-counter">1 / 1</span>
          <button id="queue-next-btn" class="hud-btn hud-btn-sm" type="button" aria-label="Next track">&#9654;</button>
          <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" value="100" aria-label="Volume" />
          <button id="queue-add-toggle-btn" class="hud-btn hud-btn-sm" type="button" aria-label="Add another track">&#43;</button>
        </div>
        <form id="queue-add-form" class="queue-add-form hidden">
          <input
            id="queue-add-url"
            type="url"
            inputmode="url"
            placeholder="Paste another SoundCloud link&hellip;"
            aria-label="Add SoundCloud track URL"
            required
          />
          <button id="queue-add-submit-btn" type="submit">Add</button>
        </form>
      </div>

      <div id="hud" class="hud hidden">
        <button id="home-btn" class="hud-btn" type="button" aria-label="Home">&#127968;</button>
        <button id="preset-prev" class="hud-btn" type="button" aria-label="Previous visualizer">&#8592;</button>
        <span id="preset-name" class="preset-name">&mdash;</span>
        <button id="preset-next" class="hud-btn" type="button" aria-label="Next visualizer">&#8594;</button>
        <button id="load-preset-btn" class="hud-btn" type="button" aria-label="Load Butterchurn preset" title="Load a Butterchurn/MilkDrop preset (.json)">&#128193;</button>
        <input id="load-preset-input" type="file" accept="application/json,.json" multiple class="visually-hidden" />
        <button id="fullscreen-btn" class="hud-btn" type="button" aria-label="Toggle fullscreen">&#x26F6;</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
